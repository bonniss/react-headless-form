name: ci

# Enforces the core guarantees (CONTRIBUTING.md → "Core guarantees") on every PR.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: guarantees (lint, types, tests, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # lint, typecheck (lib + tests), unit + guarantee tests, build,
      # consumer type tests against dist, packaging checks (publint, attw, budget)
      - run: pnpm verify

  react-compat:
    name: tests on React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['19']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # devDependencies pin React 18; swap in the matrix version (not committed)
      - run: pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: pnpm vitest run
