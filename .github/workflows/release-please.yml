on:
  push:
    branches:
      - main
  # Manual run: publishes the version in package.json if it is not on npm yet
  # (e.g. to retry a failed publish after the release was already created).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the release PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Release
        id: release
        uses: google-github-actions/release-please-action@v3
        with:
          release-type: node
          default-branch: main
          # While < 1.0.0, breaking changes bump minor (0.13 -> 0.14) instead of major
          bump-minor-pre-major: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # PRs opened with GITHUB_TOKEN do not trigger `pull_request` workflows,
      # so the release PR would have no checks. workflow_dispatch is allowed:
      # run CI on the release branch, its checks show up on the PR.
      # `pr` is empty when no release PR was opened or updated (e.g. when the
      # release PR itself is merged). Parse it in the shell: GitHub evaluates
      # step `env` expressions even when `if` is false, so fromJSON('') failed.
      - name: Run CI on the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$BRANCH" ]; then
            echo "No release PR to check."
            exit 0
          fi
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$BRANCH"

  publish:
    needs: release-please
    # run after a release was created, or on manual dispatch from main
    if: >-
      ${{ always() && github.ref_name == 'main' && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No `registry-url` on purpose: it writes an .npmrc with a placeholder
      # NODE_AUTH_TOKEN that takes precedence over OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: CI
        run: pnpm install --frozen-lockfile

      # Same gate as CI (core guarantees) — never publish a build that breaks them
      - name: Verify and build
        run: pnpm verify

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via OIDC (Trusted Publisher configured on npmjs.com),
      # no NPM_TOKEN needed. Provenance is attached automatically.
      - name: Publish
        if: ${{ steps.check.outputs.published != 'true' }}
        run: npm publish --access public
